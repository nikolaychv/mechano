services:
  db:
    image: postgres:16
    container_name: mechano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mechano
      POSTGRES_USER: mechanoDB
      POSTGRES_PASSWORD: ${MECHANO_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - mechano_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mechanoDB -d mechano"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: mechano-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@mechano.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mechano_pgdata:
