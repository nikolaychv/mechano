databaseChangeLog:

  # 1) USERS
  - changeSet:
      id: 001-create-users
      author: nikolay
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(255)
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: TIMESTAMP

        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uq_users_email

        - addUniqueConstraint:
            tableName: users
            columnNames: username
            constraintName: uq_users_username

        - createIndex:
            tableName: users
            indexName: idx_users_role
            columns:
              - column:
                  name: role

  # 2) USER_CREDENTIALS
  - changeSet:
      id: 002-create-user-credentials
      author: nikolay
      changes:
        - createTable:
            tableName: user_credentials
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_credentials
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: provider_user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_credentials
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_credentials_user

        - addUniqueConstraint:
            tableName: user_credentials
            columnNames: provider, provider_user_id
            constraintName: uq_user_credentials_provider_user

        - createIndex:
            tableName: user_credentials
            indexName: idx_user_credentials_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: user_credentials
            indexName: idx_user_credentials_email
            columns:
              - column:
                  name: email

  # 3) REPAIR_SHOPS (was: services)
  - changeSet:
      id: 003-create-repair-shops
      author: nikolay
      changes:
        - createTable:
            tableName: repair_shops
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_repair_shops
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: website
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: price_range_min
                  type: NUMERIC(10,2)
              - column:
                  name: price_range_max
                  type: NUMERIC(10,2)
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: media_storage_key
                  type: VARCHAR(255)
              - column:
                  name: cover_image_path
                  type: VARCHAR(500)
              - column:
                  name: deleted_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: repair_shops
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_repair_shops_owner

        - createIndex:
            tableName: repair_shops
            indexName: idx_repair_shops_owner_id
            columns:
              - column:
                  name: owner_id

        - createIndex:
            tableName: repair_shops
            indexName: idx_repair_shops_city
            columns:
              - column:
                  name: city

        - createIndex:
            tableName: repair_shops
            indexName: idx_repair_shops_is_active
            columns:
              - column:
                  name: is_active

        - createIndex:
            tableName: repair_shops
            indexName: idx_repair_shops_media_storage_key
            columns:
              - column:
                  name: media_storage_key

  # 4) REPAIR_SHOP_TYPES (was: service_types)
  - changeSet:
      id: 004-create-repair-shop-types
      author: nikolay
      changes:
        - createTable:
            tableName: repair_shop_types
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_repair_shop_types
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT

        - addUniqueConstraint:
            tableName: repair_shop_types
            columnNames: name
            constraintName: uq_repair_shop_types_name

  # 5) CAR_BRANDS (original changeset)
  - changeSet:
      id: 005-create-car-brands
      author: nikolay
      changes:
        - createTable:
            tableName: car_brands
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_car_brands
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: car_brands
            columnNames: name
            constraintName: uq_car_brands_name

  # 6) REPAIR_SHOP_SERVICE_TYPES (M:N + prices) (was: service_service_types)
  - changeSet:
      id: 006-create-repair-shop-service-types
      author: nikolay
      changes:
        - createTable:
            tableName: repair_shop_service_types
            columns:
              - column:
                  name: repair_shop_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: repair_shop_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: price_from
                  type: NUMERIC(10,2)
              - column:
                  name: price_to
                  type: NUMERIC(10,2)

        - addPrimaryKey:
            tableName: repair_shop_service_types
            columnNames: repair_shop_id, repair_shop_type_id
            constraintName: pk_repair_shop_service_types

        - addForeignKeyConstraint:
            baseTableName: repair_shop_service_types
            baseColumnNames: repair_shop_id
            referencedTableName: repair_shops
            referencedColumnNames: id
            constraintName: fk_rsst_repair_shop

        - addForeignKeyConstraint:
            baseTableName: repair_shop_service_types
            baseColumnNames: repair_shop_type_id
            referencedTableName: repair_shop_types
            referencedColumnNames: id
            constraintName: fk_rsst_repair_shop_type

        - createIndex:
            tableName: repair_shop_service_types
            indexName: idx_rsst_repair_shop_type_id
            columns:
              - column:
                  name: repair_shop_type_id

  # 7) REPAIR_SHOP_CAR_BRANDS (M:N) (was: service_car_brands)
  - changeSet:
      id: 007-create-repair-shop-car-brands
      author: nikolay
      changes:
        - createTable:
            tableName: repair_shop_car_brands
            columns:
              - column:
                  name: repair_shop_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: car_brand_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: repair_shop_car_brands
            columnNames: repair_shop_id, car_brand_id
            constraintName: pk_repair_shop_car_brands

        - addForeignKeyConstraint:
            baseTableName: repair_shop_car_brands
            baseColumnNames: repair_shop_id
            referencedTableName: repair_shops
            referencedColumnNames: id
            constraintName: fk_rscb_repair_shop

        - addForeignKeyConstraint:
            baseTableName: repair_shop_car_brands
            baseColumnNames: car_brand_id
            referencedTableName: car_brands
            referencedColumnNames: id
            constraintName: fk_rscb_car_brand

        - createIndex:
            tableName: repair_shop_car_brands
            indexName: idx_rscb_car_brand_id
            columns:
              - column:
                  name: car_brand_id

  # 8) BOOKINGS
  - changeSet:
      id: 008-create-bookings
      author: nikolay
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bookings

              - column:
                  name: repair_shop_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: repair_shop_type_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: car_brand_id
                  type: BIGINT

              - column:
                  name: car_model
                  type: VARCHAR(255)

              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: end_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: customer_name_at_booking
                  type: VARCHAR(255)

              - column:
                  name: customer_phone_at_booking
                  type: VARCHAR(50)

              - column:
                  name: notes_for_service
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: deleted_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: repair_shop_id
            referencedTableName: repair_shops
            referencedColumnNames: id
            constraintName: fk_bookings_repair_shop

        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: client_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_bookings_client

        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: repair_shop_type_id
            referencedTableName: repair_shop_types
            referencedColumnNames: id
            constraintName: fk_bookings_repair_shop_type

        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: car_brand_id
            referencedTableName: car_brands
            referencedColumnNames: id
            constraintName: fk_bookings_car_brand

        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: repair_shop_id, repair_shop_type_id
            referencedTableName: repair_shop_service_types
            referencedColumnNames: repair_shop_id, repair_shop_type_id
            constraintName: fk_bookings_repair_shop_repair_shop_type_pair

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_repair_shop_id
            columns:
              - column:
                  name: repair_shop_id

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_client_id
            columns:
              - column:
                  name: client_id

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_repair_shop_type_id
            columns:
              - column:
                  name: repair_shop_type_id

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_car_brand_id
            columns:
              - column:
                  name: car_brand_id

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_start_time
            columns:
              - column:
                  name: start_time

        - createIndex:
            tableName: bookings
            indexName: idx_bookings_status
            columns:
              - column:
                  name: status

  # 9) REVIEWS
  - changeSet:
      id: 009-create-reviews
      author: nikolay
      changes:
        - createTable:
            tableName: reviews
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_reviews

              - column:
                  name: repair_shop_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: parent_review_id
                  type: BIGINT

              - column:
                  name: rating_overall
                  type: SMALLINT
                  constraints:
                    nullable: false

              - column:
                  name: comment_text
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: is_visible
                  type: BOOLEAN
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: reviews
            baseColumnNames: repair_shop_id
            referencedTableName: repair_shops
            referencedColumnNames: id
            constraintName: fk_reviews_repair_shop

        - addForeignKeyConstraint:
            baseTableName: reviews
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_reviews_user

        - addForeignKeyConstraint:
            baseTableName: reviews
            baseColumnNames: parent_review_id
            referencedTableName: reviews
            referencedColumnNames: id
            constraintName: fk_reviews_parent

        - createIndex:
            tableName: reviews
            indexName: idx_reviews_repair_shop_id
            columns:
              - column:
                  name: repair_shop_id

        - createIndex:
            tableName: reviews
            indexName: idx_reviews_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: reviews
            indexName: idx_reviews_parent_review_id
            columns:
              - column:
                  name: parent_review_id

        - createIndex:
            tableName: reviews
            indexName: idx_reviews_is_visible
            columns:
              - column:
                  name: is_visible

  # 10) FAVORITES
  - changeSet:
      id: 010-create-favorites
      author: nikolay
      changes:
        - createTable:
            tableName: favorites
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: repair_shop_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: favorites
            columnNames: user_id, repair_shop_id
            constraintName: pk_favorites

        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_favorites_user

        - addForeignKeyConstraint:
            baseTableName: favorites
            baseColumnNames: repair_shop_id
            referencedTableName: repair_shops
            referencedColumnNames: id
            constraintName: fk_favorites_repair_shop

        - createIndex:
            tableName: favorites
            indexName: idx_favorites_repair_shop_id
            columns:
              - column:
                  name: repair_shop_id

  # 11) USER_CONSENTS
  - changeSet:
      id: 011-create-user-consents
      author: nikolay
      changes:
        - createTable:
            tableName: user_consents
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_consents

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: granted
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_consents
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_consents_user

        - createIndex:
            tableName: user_consents
            indexName: idx_user_consents_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: user_consents
            indexName: idx_user_consents_type_at
            columns:
              - column:
                  name: type
              - column:
                  name: at

  # 12) EXTRA: CHECK constraints (recommended)
  - changeSet:
      id: 012-add-check-constraints
      author: nikolay
      changes:
        - sql:
            sql: >
              ALTER TABLE users
              ADD CONSTRAINT chk_users_role
              CHECK (role IN ('CLIENT','SERVICE_OWNER','ADMIN'));

        - sql:
            sql: >
              ALTER TABLE user_credentials
              ADD CONSTRAINT chk_user_credentials_provider
              CHECK (provider IN ('LOCAL','GOOGLE'));

        - sql:
            sql: >
              ALTER TABLE bookings
              ADD CONSTRAINT chk_bookings_status
              CHECK (status IN ('PENDING','CONFIRMED','CANCELLED','COMPLETED'));

        - sql:
            sql: >
              ALTER TABLE bookings
              ADD CONSTRAINT chk_bookings_time_range
              CHECK (end_time > start_time);

        - sql:
            sql: >
              ALTER TABLE reviews
              ADD CONSTRAINT chk_reviews_rating_overall
              CHECK (rating_overall BETWEEN 1 AND 5);

        - sql:
            sql: >
              ALTER TABLE repair_shops
              ADD CONSTRAINT chk_repair_shops_price_range
              CHECK (
                price_range_min IS NULL OR price_range_max IS NULL
                OR price_range_min <= price_range_max
              );

        - sql:
            sql: >
              ALTER TABLE repair_shop_service_types
              ADD CONSTRAINT chk_rsst_price_range
              CHECK (
                price_from IS NULL OR price_to IS NULL
                OR price_from <= price_to
              );

  # 13) CAR_BRANDS - SOFT DELETE SUPPORT (add deleted_at + partial unique index)
  - changeSet:
      id: 013-car-brands-soft-delete
      author: nikolay
      changes:
        # 1) add deleted_at
        - addColumn:
            tableName: car_brands
            columns:
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true

        # 2) optional index for filtering
        - createIndex:
            tableName: car_brands
            indexName: idx_car_brands_deleted_at
            columns:
              - column:
                  name: deleted_at

        # 3) drop old unique constraint (from the initial schema)
        - dropUniqueConstraint:
            tableName: car_brands
            constraintName: uq_car_brands_name

        # 4) partial unique index (PostgreSQL only)
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: >
              CREATE UNIQUE INDEX IF NOT EXISTS uq_car_brands_name_active
              ON car_brands (name)
              WHERE deleted_at IS NULL;

  # 14) REVIEWS - SOFT DELETE SUPPORT (add deleted_at + index)
  - changeSet:
      id: 014-reviews-soft-delete
      author: nikolay
      changes:
        # 1) add deleted_at
        - addColumn:
            tableName: reviews
            columns:
              - column:
                  name: deleted_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true

        # 2) optional index for filtering
        - createIndex:
            tableName: reviews
            indexName: idx_reviews_deleted_at
            columns:
              - column:
                  name: deleted_at

  # 015) REVIEWS - REMOVE is_visible (we use deleted_at for soft delete)
  - changeSet:
      id: 015-reviews-drop-is-visible
      author: nikolay
      changes:
        - dropIndex:
            tableName: reviews
            indexName: idx_reviews_is_visible

        - dropColumn:
            tableName: reviews
            columnName: is_visible
